<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <nz-card class="w-full max-w-md shadow-lg">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Create account</h2>
            <p class="mt-2 text-gray-600">Enter your details to get started.</p>
        </div>

        <form nz-form [formGroup]="signupForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
            <nz-form-item>
                <nz-form-label nzRequired nzFor="name">Full Name</nz-form-label>
                <nz-form-control nzErrorTip="Please enter your name">
                    <nz-input-group nzPrefixIcon="user">
                        <input type="text" nz-input formControlName="name" id="name"
                            placeholder="Enter your full name" />
                    </nz-input-group>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label nzRequired nzFor="email">Email</nz-form-label>
                <nz-form-control nzErrorTip="Please enter a valid email">
                    <nz-input-group nzPrefixIcon="mail">
                        <input type="email" nz-input formControlName="email" id="email"
                            placeholder="Enter your email" />
                    </nz-input-group>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label nzRequired nzFor="password">Password</nz-form-label>
                <nz-form-control nzErrorTip="Password must be at least 6 characters">
                    <nz-input-group nzPrefixIcon="lock">
                        <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="password"
                            id="password" placeholder="Create a password" />
                    </nz-input-group>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-label nzRequired nzFor="confirmPassword">Confirm Password</nz-form-label>
                <nz-form-control [nzErrorTip]="confirmPasswordError">
                    <nz-input-group nzPrefixIcon="lock">
                        <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="confirmPassword"
                            id="confirmPassword" placeholder="Confirm your password" />
                    </nz-input-group>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item>
                <nz-form-control>
                    <label nz-checkbox formControlName="agreeTerms">
                        <span>I agree to the <a class="text-blue-600">Terms of Service</a> and <a
                                class="text-blue-600">Privacy Policy</a></span>
                    </label>
                </nz-form-control>
            </nz-form-item>

            <button nz-button nzType="primary" nzBlock nzSize="large" [nzLoading]="isLoading"
                [disabled]="signupForm.invalid" type="submit" class="mb-4">
                Create account
            </button>

            <div class="text-center">
                <span class="text-gray-600">Already have an account? </span>
                <a routerLink="/account/login" class="text-blue-600 hover:text-blue-500 font-medium">
                    Sign in
                </a>
            </div>
        </form>
    </nz-card>
</div>
